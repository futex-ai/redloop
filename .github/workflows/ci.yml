name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ACTIONLINT_VERSION: v1.7.12
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TOOLCHAIN: 1.89.0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest-m
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install actionlint
        run: |
          asset="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          install_root="${RUNNER_TEMP}/actionlint"
          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 120 \
            --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${asset}" \
            --output "${RUNNER_TEMP}/${asset}"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum --check
          mkdir -p "${install_root}"
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${install_root}" actionlint
          echo "${install_root}" >> "$GITHUB_PATH"

      - name: Run workspace checks
        timeout-minutes: 45
        run: cargo xtask check
