[package]
name = "redloop"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Redis-backed queue library for ASAP and scheduled jobs"
repository.workspace = true

[[test]]
name = "storage_integration"
path = "tests/storage_integration/mod.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
redis = { version = "1.2.0", features = ["tokio-comp", "connection-manager", "cluster-async", "sentinel"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["v7"] }

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
unimock = "0.6.8"
